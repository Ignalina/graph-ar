# Stage-by-stage perf bench behind docs/perf.md. A separate package so that its
# dependencies (static search tree, mmap) stay out of the crate's manifest.
[package]
name = "graphar-perf-bench"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
arrow-array = "59"
arrow-schema = "59"
bytes = "1"
graphar = { path = "../.." }
memmap2 = "0.9"
znippy-zoomies = { version = "0.1.26", default-features = false }
