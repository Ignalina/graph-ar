header:
  license:
    spdx-id: Apache-2.0
    copyright-owner: Apache Software Foundation
  # Explicit globs: license-eye 0.8.0 skips every file when the only path is `.`.
  paths:
    - "src/**"
    - "tests/**"
    - "bench/**"
    - "*.toml"
    - ".github/**"
  excludes:
    - "**/*.md"
    - NOTICE
    - LICENSE
    - testing/**
    - target/**
    - .gitmodules
    - "**/.gitignore"
    - "**/*.lock"
    - "**/*.json"
    - "**/*.svg"
