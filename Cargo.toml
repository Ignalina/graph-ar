[package]
name = "graphar"
description = "Native Rust reader and writer for the Apache GraphAr (gar/v1) file format"
version = "0.3.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://git.gunnar.rs/nordisk/graph-ar"
readme = "README.md"
keywords = ["graph", "graphar", "arrow", "parquet"]
categories = ["data-structures", "encoding"]
# The crate name and publication are for the Apache GraphAr project to decide.
publish = false

[features]
default = []
# Apache ORC chunks through orc-rust (pure Rust, on the same arrow major).
orc = ["dep:orc-rust"]

[dependencies]
arrow = { version = "59", features = ["prettyprint"] }
arrow-array = "59"
arrow-csv = "59"
arrow-schema = "59"
bytes = "1"
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "http"] }
orc-rust = { version = "0.9", optional = true }
parquet = { version = "59", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
url = "2"

[dev-dependencies]
tempfile = "3"
testcontainers = "0.27"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
